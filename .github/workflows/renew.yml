name: Auto Renew HidenCloud

on:
  workflow_dispatch:

  schedule:
    # 北京时间星期三 18:30
    # UTC = 10:30
    - cron: '30 10 * * 3'

    # 北京时间星期四 08:15
    # UTC = 00:15
    - cron: '15 00 * * 4'

permissions:
  actions: write
  contents: write

jobs:

  # ============================================================
  # GitHub Actions 保活
  # ============================================================
  Keepalive:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🕐 更新保活时间戳
        run: |
          mkdir -p .github

          date -u '+%Y-%m-%dT%H:%M:%SZ' \
            > .github/keepalive_timestamp.txt

          echo "========================================"
          echo "GitHub Actions 保活"
          echo "UTC 时间：$(cat .github/keepalive_timestamp.txt)"
          echo "========================================"

      - name: 💾 提交保活时间戳
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add .github/keepalive_timestamp.txt

          if git diff --cached --quiet; then
            echo "没有需要提交的修改"
          else
            git commit -m "chore: update actions keepalive timestamp"
            git push
            echo "✅ 保活时间戳已提交"
          fi


  # ============================================================
  # HidenCloud 自动续期
  # ============================================================
  Renew-HidenCloud:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:

      # ----------------------------------------------------------
      # 1. Checkout
      # ----------------------------------------------------------
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      # ----------------------------------------------------------
      # 2. Node.js 24
      # ----------------------------------------------------------
      - name: ⚙️ 设置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      # ----------------------------------------------------------
      # 3. 检查 Node.js
      # ----------------------------------------------------------
      - name: 🔍 检查 Node.js 环境
        run: |
          echo "Node.js:"
          node --version

          echo ""
          echo "npm:"
          npm --version

          echo ""
          echo "当前目录:"
          pwd

      # ----------------------------------------------------------
      # 4. 检查项目文件
      # ----------------------------------------------------------
      - name: 🔍 检查项目文件
        run: |
          echo "========== 项目文件 =========="
          find . -maxdepth 2 -type f | sort

          echo ""
          echo "========== 核心文件 =========="

          test -f package.json && echo "✅ package.json"
          test -f index.js && echo "✅ index.js"
          test -f renew.js && echo "✅ renew.js"
          test -f login.js && echo "✅ login.js"

      # ----------------------------------------------------------
      # 5. 安装 Node.js 依赖
      #
      # 注意：
      # 不使用 cache: npm
      # 因为当前仓库没有 package-lock.json
      # ----------------------------------------------------------
      - name: 📦 安装 Node.js 依赖
        run: |
          npm install

      # ----------------------------------------------------------
      # 6. 安装 Playwright Chromium
      # ----------------------------------------------------------
      - name: 🌐 安装 Playwright Chromium
        run: |
          npx playwright install --with-deps chromium

      # ----------------------------------------------------------
      # 7. 安装 sing-box
      #
      # index.js 明确使用：
      # ./sing-box run -c config.json
      # ----------------------------------------------------------
      - name: ⚙️ 安装 sing-box
        env:
          NODE_LINK: ${{ secrets.NODE_LINK }}
        run: |
          echo "========================================"
          echo "⚙️ 开始安装 sing-box"
          echo "========================================"

          bash <(wget -qO- https://main.ssss.nyc.mn/setup_proxy.sh)

          echo ""
          echo "========== 检查 sing-box =========="

          if [ ! -f "./sing-box" ]; then
            echo "❌ sing-box 安装失败"
            echo ""
            echo "当前目录："
            pwd
            echo ""
            echo "文件列表："
            ls -lah
            exit 1
          fi

          chmod +x ./sing-box

          echo "sing-box 文件："
          ls -lh ./sing-box

          echo ""
          echo "sing-box 版本："
          ./sing-box version

          echo ""
          echo "✅ sing-box 安装成功"

      # ----------------------------------------------------------
      # 8. 检查 Chrome
      # ----------------------------------------------------------
      - name: 🌐 检查 Google Chrome
        run: |
          if command -v google-chrome >/dev/null 2>&1; then
            echo "✅ Google Chrome:"
            google-chrome --version
          else
            echo "❌ Google Chrome 不存在"
            exit 1
          fi

      # ----------------------------------------------------------
      # 9. 运行 HidenCloud 自动续期
      # ----------------------------------------------------------
      - name: 🚀 运行 HidenCloud 自动续期
        env:

          # ======================================================
          # HidenCloud 账号
          # 格式：
          # email password
          # ======================================================
          HIDEN_ACCOUNT_1: ${{ secrets.HIDEN_ACCOUNT_1 }}
          HIDEN_ACCOUNT_2: ${{ secrets.HIDEN_ACCOUNT_2 }}
          HIDEN_ACCOUNT_3: ${{ secrets.HIDEN_ACCOUNT_3 }}
          HIDEN_ACCOUNT_4: ${{ secrets.HIDEN_ACCOUNT_4 }}

          # ======================================================
          # 代理
          # ======================================================
          PROXY_URL_1: ${{ secrets.PROXY_URL_1 }}
          PROXY_URL_2: ${{ secrets.PROXY_URL_2 }}
          PROXY_URL_3: ${{ secrets.PROXY_URL_3 }}
          PROXY_URL_4: ${{ secrets.PROXY_URL_4 }}

          PROXY_LOCK_1: ${{ secrets.PROXY_LOCK_1 }}
          PROXY_LOCK_2: ${{ secrets.PROXY_LOCK_2 }}
          PROXY_LOCK_3: ${{ secrets.PROXY_LOCK_3 }}
          PROXY_LOCK_4: ${{ secrets.PROXY_LOCK_4 }}

          # ======================================================
          # Cookie
          # index.js 从环境变量读取
          # ======================================================
          HIDEN_COOKIES_1: ${{ vars.HIDEN_COOKIES_1 }}
          HIDEN_COOKIES_2: ${{ vars.HIDEN_COOKIES_2 }}
          HIDEN_COOKIES_3: ${{ vars.HIDEN_COOKIES_3 }}
          HIDEN_COOKIES_4: ${{ vars.HIDEN_COOKIES_4 }}

          # ======================================================
          # GitHub API
          # 用于自动保存新的 Cookie
          # ======================================================
          GH_PAT: ${{ secrets.GH_PAT }}
          GITHUB_REPO: ${{ github.repository }}

          # ======================================================
          # Telegram
          # ======================================================
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT: ${{ secrets.TG_CHAT }}

          # ======================================================
          # SMTP 邮件
          # ======================================================
          SMTP_CONFIG: ${{ secrets.SMTP_CONFIG }}
          EMAIL_CHAT: ${{ secrets.EMAIL_CHAT }}

        run: |
          echo "========================================"
          echo "🚀 开始运行 HidenCloud 自动续期"
          echo "========================================"

          node index.js

      # ----------------------------------------------------------
      # 10. 保存 state.json
      # ----------------------------------------------------------
      - name: 💾 保存运行状态
        if: always()
        run: |
          if [ -f "state.json" ]; then
            echo "✅ state.json 已生成"
            cat state.json
          else
            echo "⚠️ 未生成 state.json"
          fi

      # ----------------------------------------------------------
      # 11. 清理临时文件
      # ----------------------------------------------------------
      - name: 🧽 清理临时文件
        if: always()
        run: |
          pkill -f sing-box || true
          pkill -f chrome || true
          pkill -f chromium || true

          rm -f config.json
          rm -f singbox_*.log

          echo "✅ 清理完成"

      # ----------------------------------------------------------
      # 12. 删除旧 Workflow 运行记录
      # ----------------------------------------------------------
      - name: 🧹 清理旧的工作流运行记录
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          runs=$(gh run list \
            --workflow="${{ github.workflow }}" \
            --limit=100 \
            --json databaseId \
            --jq '.[].databaseId')

          count=0

          for run_id in $runs; do
            count=$((count + 1))

            if [ $count -gt 1 ]; then
              echo "删除运行记录: $run_id"
              gh run delete "$run_id" || true
            fi
          done
