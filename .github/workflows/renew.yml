name: Auto Renew HidenCloud

on:
  workflow_dispatch:
  schedule:
    - cron: '30 10 * * 3' # 根据到期时间在星期几 提前一天,比如星期三到期，cron写星期二即可
    - cron: '15 00 * * 4'
    
permissions:
  actions: write
  contents: write

jobs:

  # ============================================================
  # GitHub Actions 保活
  # 每次 Workflow 运行时更新一个时间戳文件并提交
  # 防止仓库长期没有 Commit 导致 Scheduled Workflow 被停用
  # ============================================================
  Keepalive:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: 🕐 更新保活时间戳
        run: |
          mkdir -p .github
          date -u '+%Y-%m-%dT%H:%M:%SZ' > .github/keepalive_timestamp.txt

          echo "========================================"
          echo "GitHub Actions 保活时间戳"
          echo "UTC 时间：$(cat .github/keepalive_timestamp.txt)"
          echo "========================================"

      - name: 💾 提交时间戳
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add .github/keepalive_timestamp.txt

          if git diff --cached --quiet; then
            echo "没有需要提交的修改"
          else
            git commit -m "chore: update actions keepalive timestamp"
            git push
            echo "✅ 保活时间戳已提交"
          fi


  # ============================================================
  # 原来的 HidenCloud 自动续期
  # ============================================================
  Renew-HidenCloud:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: ⚙ 设置 Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: 🛠️ 安装系统依赖和 Python 依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb
          pip install playwright requests 'requests[socks]'
          python -m playwright install --with-deps chrome

      - name: ⚙ 设置代理 (sing-box)
        env:
          NODE_LINK: ${{ secrets.NODE_LINK }}
        run: |
          bash <(wget -qO- https://main.ssss.nyc.mn/setup_proxy.sh)

      - name: 🚀 运行续期脚本
        env:
          EMAIL: ${{ secrets.EMAIL }}
          PASSWORD: ${{ secrets.PASSWORD }}
          COOKIE_VALUE: ${{ secrets.COOKIE_VALUE }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          IS_PROXY: ${{ env.IS_PROXY }}
          PROXY_SERVER: ${{ env.PROXY_SERVER }}
        run: xvfb-run --auto-servernum --server-args="-screen 0 1920x1080x24" python3 app.py

      - name: 🧽 清理进程和临时文件
        if: always()
        run: |
          pkill -f sing-box || true
          pkill -f chromedriver || true
          pkill -f chrome || true
          pkill -f Xvfb || true
          rm -f sing-box sing-box-config.json sing-box.log

      - name: 🧹 清理旧的工作流运行记录
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          runs=$(gh run list --workflow="${{ github.workflow }}" --limit=100 --json databaseId --jq '.[].databaseId')
          count=0

          for run_id in $runs; do
            count=$((count + 1))

            if [ $count -gt 1 ]; then
              echo "删除运行记录: $run_id"
              gh run delete $run_id || true
            fi
          done
