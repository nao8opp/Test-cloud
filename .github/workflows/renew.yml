name: Auto Renew HidenCloud

on:
  workflow_dispatch:

  schedule:
    # 北京时间每周三 18:30
    # UTC = 10:30
    - cron: "30 10 * * 3"

    # 北京时间每周四 08:15
    # UTC = 00:15
    - cron: "15 0 * * 4"

permissions:
  contents: write
  actions: write

jobs:

  # ============================================================
  # HidenCloud 自动续期
  # ============================================================
  Renew-HidenCloud:
    name: 🚀 HidenCloud 自动续期
    runs-on: ubuntu-latest

    timeout-minutes: 30

    steps:

      # --------------------------------------------------------
      # 1. 检出代码
      # --------------------------------------------------------
      - name: 📥 Checkout
        uses: actions/checkout@v4

      # --------------------------------------------------------
      # 2. Node.js
      # --------------------------------------------------------
      - name: 🟢 设置 Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      # --------------------------------------------------------
      # 3. 检查 Node / npm
      # --------------------------------------------------------
      - name: 🔍 检查运行环境
        run: |
          echo "========================================"
          echo "🔍 运行环境"
          echo "========================================"

          node --version
          npm --version
          npx --version

          echo ""
          echo "当前目录："
          pwd

          echo ""
          echo "项目文件："
          ls -lah

      # --------------------------------------------------------
      # 4. 安装 Node 依赖
      # --------------------------------------------------------
      - name: 📦 安装 Node.js 依赖
        run: |
          echo "========================================"
          echo "📦 安装 Node.js 依赖"
          echo "========================================"

          if [ -f "package-lock.json" ]; then
            echo "检测到 package-lock.json"
            npm ci
          else
            echo "未检测到 package-lock.json"
            npm install
          fi

      # --------------------------------------------------------
      # 5. 安装 Playwright Chromium
      # --------------------------------------------------------
      - name: 🌐 安装 Playwright
        run: |
          echo "========================================"
          echo "🌐 安装 Playwright Chromium"
          echo "========================================"

          npx playwright install --with-deps chromium

      # --------------------------------------------------------
      # 6. 检查 Google Chrome
      # --------------------------------------------------------
      - name: 🌍 检查 Google Chrome
        run: |
          echo "========================================"
          echo "🌍 检查 Google Chrome"
          echo "========================================"

          if [ -f "/usr/bin/google-chrome" ]; then
            echo "✅ 找到 Google Chrome"
            /usr/bin/google-chrome --version
          elif command -v google-chrome >/dev/null 2>&1; then
            echo "✅ 找到 Google Chrome"
            google-chrome --version
          else
            echo "⚠️ 未找到 Google Chrome"

            echo "尝试安装 Google Chrome..."

            wget -q \
              https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb \
              -O /tmp/google-chrome.deb

            sudo apt-get update
            sudo apt-get install -y /tmp/google-chrome.deb

            google-chrome --version
          fi

      # --------------------------------------------------------
      # 7. 安装 sing-box
      # --------------------------------------------------------
      - name: ⚙️ 安装 sing-box
        env:
          NODE_LINK: ${{ secrets.NODE_LINK }}
        run: |
          set -e

          echo "========================================"
          echo "⚙️ 开始安装 sing-box"
          echo "========================================"

          if [ -n "$NODE_LINK" ]; then
            echo "✅ 检测到 NODE_LINK"
          else
            echo "ℹ️ 未配置 NODE_LINK，使用直连模式"
          fi

          echo ""
          echo "========== 获取 sing-box 最新版本 =========="

          SB_VERSION=$(curl -fsSL \
            https://api.github.com/repos/SagerNet/sing-box/releases/latest \
            | grep '"tag_name":' \
            | sed -E 's/.*"([^"]+)".*/\1/')

          if [ -z "$SB_VERSION" ]; then
            echo "❌ 无法获取 sing-box 版本"
            exit 1
          fi

          echo "sing-box 版本：$SB_VERSION"

          echo ""
          echo "========== 下载 sing-box =========="

          SB_VERSION_NUMBER="${SB_VERSION#v}"

          wget -q \
            "https://github.com/SagerNet/sing-box/releases/download/${SB_VERSION}/sing-box-${SB_VERSION_NUMBER}-linux-amd64.tar.gz" \
            -O /tmp/sing-box.tar.gz

          echo ""
          echo "========== 解压 sing-box =========="

          rm -rf /tmp/sing-box-extract
          mkdir -p /tmp/sing-box-extract

          tar -xzf \
            /tmp/sing-box.tar.gz \
            -C /tmp/sing-box-extract

          echo ""
          echo "========== 查找 sing-box =========="

          SB_BIN=$(find /tmp/sing-box-extract \
            -type f \
            -name "sing-box" \
            | head -n 1)

          if [ -z "$SB_BIN" ]; then
            echo "❌ 未找到 sing-box 可执行文件"

            echo ""
            echo "解压后的文件："
            find /tmp/sing-box-extract -maxdepth 4 -type f -print

            exit 1
          fi

          echo "找到：$SB_BIN"

          cp "$SB_BIN" ./sing-box
          chmod +x ./sing-box

          echo ""
          echo "========== 检查 sing-box =========="

          if [ ! -f "./sing-box" ]; then
            echo "❌ ./sing-box 不存在"
            exit 1
          fi

          if [ ! -x "./sing-box" ]; then
            echo "❌ ./sing-box 没有执行权限"
            chmod +x ./sing-box
          fi

          ls -lh ./sing-box

          ./sing-box version

          echo ""
          echo "✅ sing-box 安装成功"

      # --------------------------------------------------------
      # 8. 检查 proxyurl.js
      # --------------------------------------------------------
      - name: 🔧 检查代理模块
        run: |
          echo "========================================"
          echo "🔧 检查项目文件"
          echo "========================================"

          required_files=(
            "index.js"
            "login.js"
            "renew.js"
            "proxyurl.js"
            "package.json"
            "sing-box"
          )

          for file in "${required_files[@]}"; do
            if [ -f "$file" ]; then
              echo "✅ $file"
            else
              echo "❌ 缺少 $file"
            fi
          done

          echo ""
          echo "当前目录："
          pwd

          echo ""
          echo "文件列表："
          ls -lah

      # --------------------------------------------------------
      # 9. 运行 HidenCloud 自动续期
      # --------------------------------------------------------
      - name: 🚀 执行自动续期
        env:

          # ====================================================
          # HidenCloud 账号
          #
          # 格式：
          # HIDEN_ACCOUNT_1 = 邮箱 密码
          # HIDEN_ACCOUNT_2 = 邮箱 密码
          # ====================================================

          HIDEN_ACCOUNT_1: ${{ secrets.HIDEN_ACCOUNT_1 }}
          HIDEN_ACCOUNT_2: ${{ secrets.HIDEN_ACCOUNT_2 }}
          HIDEN_ACCOUNT_3: ${{ secrets.HIDEN_ACCOUNT_3 }}
          HIDEN_ACCOUNT_4: ${{ secrets.HIDEN_ACCOUNT_4 }}

          # ====================================================
          # 代理
          # ====================================================

          PROXY_URL_1: ${{ secrets.PROXY_URL_1 }}
          PROXY_URL_2: ${{ secrets.PROXY_URL_2 }}
          PROXY_URL_3: ${{ secrets.PROXY_URL_3 }}
          PROXY_URL_4: ${{ secrets.PROXY_URL_4 }}

          PROXY_LOCK_1: ${{ vars.PROXY_LOCK_1 }}
          PROXY_LOCK_2: ${{ vars.PROXY_LOCK_2 }}
          PROXY_LOCK_3: ${{ vars.PROXY_LOCK_3 }}
          PROXY_LOCK_4: ${{ vars.PROXY_LOCK_4 }}

          # ====================================================
          # Cookie
          # ====================================================

          HIDEN_COOKIES_1: ${{ vars.HIDEN_COOKIES_1 }}
          HIDEN_COOKIES_2: ${{ vars.HIDEN_COOKIES_2 }}
          HIDEN_COOKIES_3: ${{ vars.HIDEN_COOKIES_3 }}
          HIDEN_COOKIES_4: ${{ vars.HIDEN_COOKIES_4 }}

          # ====================================================
          # sing-box / 代理节点
          # ====================================================

          NODE_LINK: ${{ secrets.NODE_LINK }}

          # ====================================================
          # GitHub
          #
          # 用于自动更新 HIDEN_COOKIES_X
          # ====================================================

          GH_PAT: ${{ secrets.GH_PAT }}
          GITHUB_REPO: ${{ github.repository }}

          # ====================================================
          # Telegram
          # ====================================================

          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT: ${{ secrets.TG_CHAT }}

          # ====================================================
          # SMTP 邮件
          # ====================================================

          SMTP_CONFIG: ${{ secrets.SMTP_CONFIG }}
          EMAIL_CHAT: ${{ secrets.EMAIL_CHAT }}

        run: |
          set -e

          echo "========================================"
          echo "🚀 开始执行 HidenCloud 自动续期"
          echo "========================================"

          echo ""
          echo "Node.js："
          node --version

          echo ""
          echo "项目入口："
          echo "node index.js"

          echo ""
          echo "========================================"

          node index.js

      # --------------------------------------------------------
      # 10. 清理进程
      # --------------------------------------------------------
      - name: 🧹 清理运行环境
        if: always()
        run: |
          echo "========================================"
          echo "🧹 清理运行环境"
          echo "========================================"

          pkill -f sing-box || true
          pkill -f google-chrome || true
          pkill -f chrome || true

          rm -f /tmp/sing-box.tar.gz || true

          echo "✅ 清理完成"

      # --------------------------------------------------------
      # 11. 显示最终状态
      # --------------------------------------------------------
      - name: 📊 最终状态
        if: always()
        run: |
          echo "========================================"
          echo "📊 最终状态"
          echo "========================================"

          echo ""
          echo "工作目录："
          pwd

          echo ""
          echo "state.json："

          if [ -f "state.json" ]; then
            cat state.json
          else
            echo "⚠️ state.json 不存在"
          fi

          echo ""
          echo "========================================"
          echo "任务结束"
          echo "========================================"


  # ============================================================
  # Keepalive
  # 防止 GitHub Actions 长时间没有活动
  # ============================================================
  Keepalive:
    name: 🔄 Keepalive
    runs-on: ubuntu-latest

    steps:

      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🔄 更新 Keepalive
        run: |
          echo "Last keepalive: $(date -u '+%Y-%m-%d %H:%M:%S UTC')" \
            > .github/keepalive_timestamp.txt

      - name: 💾 提交 Keepalive
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add .github/keepalive_timestamp.txt

          if git diff --cached --quiet; then
            echo "没有需要提交的修改"
          else
            git commit -m "chore: update keepalive timestamp"
            git push
          fi
